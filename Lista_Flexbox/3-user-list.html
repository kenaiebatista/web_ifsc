<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3 - Lista de Usuários com Flexbox</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 30px;
            background-color: #f5f5f5;
        }
        .lista-usuarios {
            display: flex;
            flex-direction: column;
            width: 320px;
            background-color: #9e9e9e;
            padding: 20px;
            border-radius: 6px;
        }
        .usuario {
            display: flex;
            align-items: center;
            background-color: transparent;
            padding: 10px 0;
        }
        .usuario img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            margin-right: 12px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .usuario .info {
            display: flex;
            flex-direction: column;
        }
        .usuario .nome {
            color: #fff;
            font-weight: bold;
            font-size: 0.95em;
        }
        .usuario .endereco {
            color: #eee;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
<!--Autor: [Kenai Batista] - Criado em 21/09/2026-->

    <div class="lista-usuarios">
        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/women/65.jpg" alt="Foto de Linda Hart">
            <div class="info">
                <span class="nome">Linda Hart</span>
                <span class="endereco">6765 Shady Ln Dr</span>
            </div>
        </div>
        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Foto de Roger Medina">
            <div class="info">
                <span class="nome">Roger Medina</span>
                <span class="endereco">2420 Paddock Way</span>
            </div>
        </div>
        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/men/78.jpg" alt="Foto de Dean Sullivan">
            <div class="info">
                <span class="nome">Dean Sullivan</span>
                <span class="endereco">6727 Airplane Ave</span>
            </div>
        </div>
        <div class="usuario">
            <img src="https://randomuser.me/api/portraits/women/21.jpg" alt="Foto de Elizabeth Austin">
            <div class="info">
                <span class="nome">Elizabeth Austin</span>
                <span class="endereco">6685 Blossom Hill Rd</span>
            </div>
        </div>
    </div>

    <p style="position:absolute; bottom:10px; left:20px; max-width:600px; font-size:0.85em; color:#666;">
        <sub>obs.: fotos de usuários geradas pelo serviço <a href="https://randomuser.me/" target="_blank">randomuser.me</a>, conforme sugerido no enunciado.</sub>
    </p>

</body>
</html>
