<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 6 - Grid Layout com Responsividade</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            padding: 30px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr 60px;
            grid-template-rows: repeat(3, 90px);
            grid-template-areas:
                "laranja rosa   verde   bola1"
                "azul    verde  verde   bola2"
                "amarelo amarelo verde  bola3";
            gap: 8px;
            width: 100%;
            max-width: 700px;
        }
        .laranja { grid-area: laranja; background-color: #ff9800; }
        .rosa    { grid-area: rosa;    background-color: #f4a7a0; }
        .verde   { grid-area: verde;   background-color: #a4c639; }
        .azul    { grid-area: azul;    background-color: #b8cbe0; }
        .amarelo { grid-area: amarelo; background-color: #ffc107; }

        .grid-container > div { border-radius: 4px; }

        .bola {
            border-radius: 50%;
            align-self: center;
            width: 42px;
            height: 42px;
        }
        .bola1 { grid-area: bola1; background-color: #ff5722; }
        .bola2 { grid-area: bola2; background-color: #ba68c8; }
        .bola3 { grid-area: bola3; background-color: #7cb342; }

        /* Responsividade: abaixo de 600px, empilha tudo em lista vertical */
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "laranja"
                    "rosa"
                    "verde"
                    "azul"
                    "amarelo"
                    "bola1"
                    "bola2"
                    "bola3";
                grid-template-rows: auto;
            }
            .grid-container > div { height: 60px; }
            .bola { justify-self: center; }
        }
    </style>
</head>
<body>
<!--Autor: [Kenai Batista] - Criado em 21/09/2026-->

    <div class="grid-container">
        <div class="laranja"></div>
        <div class="rosa"></div>
        <div class="verde"></div>
        <div class="azul"></div>
        <div class="amarelo"></div>
        <div class="bola bola1"></div>
        <div class="bola bola2"></div>
        <div class="bola bola3"></div>
    </div>

    <p style="position:absolute; bottom:10px; left:20px; max-width:600px; font-size:0.85em; color:#666;">
        <sub>obs.: layout construído com <code>display: grid</code> e <code>grid-template-areas</code>,
        nomeando cada área para facilitar a leitura do layout. Redimensione a janela para menos de
        600px de largura para ver os elementos se reorganizarem em uma lista vertical, um sobre o
        outro, via <code>@media (max-width: 600px)</code>.</sub>
    </p>

</body>
</html>
