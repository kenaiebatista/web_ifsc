<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2 - Grid: Header / Nav / Content / Footer</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            font-family: Arial, sans-serif;
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: 90px 1fr 60px;
            grid-template-areas:
                "header  header"
                "nav     content"
                "footer  footer";
            min-height: 100vh;
            min-width: 100vw;
        }
        header {
            grid-area: header;
            background-color: #e91e63;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
        }
        nav {
            grid-area: nav;
            background-color: #b5ba6a;
            padding: 20px;
        }
        .content {
            grid-area: content;
            background-color: #f5c78e;
            padding: 20px;
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 20px;
            align-content: start;
        }
        .content h2 { grid-column: 1 / -1; text-align: center; margin-top: 0; }
        .content .imagem {
            width: 100%;
            aspect-ratio: 1;
            border: 2px solid #333;
            background-color: #f5c78e;
        }
        .content .linhas span {
            display: block;
            height: 3px;
            background-color: #333;
            margin-bottom: 10px;
        }
        footer {
            grid-area: footer;
            background-color: #4caf7d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>
<!--Autor: [Kenai Batista] - Criado em 21/09/2026-->

    <header>Header</header>
    <nav>
        <h3>Nav</h3>
        <p>Menu de navegação lateral.</p>
    </nav>
    <div class="content">
        <h2>Content</h2>
        <div class="imagem"></div>
        <div class="linhas">
            <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>
    <footer>Footer</footer>

</body>
</html>
