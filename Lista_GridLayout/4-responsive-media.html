<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4 - Layout Responsivo com Media Screen</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            font-family: Arial, sans-serif;
            display: grid;
            grid-template-columns: 160px 1fr 160px;
            grid-template-rows: 60px 60px 1fr 60px;
            grid-template-areas:
                "header  header  header"
                "asideL  banner  asideR"
                "asideL  main    asideR"
                "footer  footer  footer";
            min-height: 100vh;
            gap: 4px;
        }
        header      { grid-area: header;  background-color: #ffb300; }
        .banner     { grid-area: banner;  background-color: #e53935; }
        .aside-left { grid-area: asideL;  background-color: #43a047; }
        .aside-right{ grid-area: asideR;  background-color: #ffb300; }
        main        { grid-area: main;    background-color: #1e88e5; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.3em; text-align: center; }
        footer      { grid-area: footer;  background-color: #1e88e5; }

        header, footer, .banner, .aside-left, .aside-right {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
        }

        /* Abaixo de 700px, empilha tudo verticalmente (layout mobile) */
        @media screen and (max-width: 700px) {
            body {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(6, auto) 1fr auto;
                grid-template-areas:
                    "header"
                    "banner"
                    "asideL"
                    "main"
                    "asideR"
                    "footer";
            }
            header, .banner, .aside-left, .aside-right, footer { min-height: 60px; }
            main { min-height: 200px; }
        }
    </style>
</head>
<body>
<!--Autor: [Kenai Batista] - Criado em 21/09/2026-->

    <header>Header</header>
    <div class="banner">Banner</div>
    <div class="aside-left">Left Aside</div>
    <main>Main Content</main>
    <div class="aside-right">Right Aside</div>
    <footer>Footer</footer>

</body>
</html>
